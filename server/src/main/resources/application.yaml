server:
  port: 8080
  servlet:
    context-path: /quan-ly-vua-ca


spring:
  config:
    import: "optional:file:server/.env[.properties],optional:file:.env[.properties]"
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
#    hikari:
#      maximum-pool-size: 20
#      minimum-idle: 5
#      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      # Chuyển từ validate sang update để Hibernate tự tạo bảng/cột mới (công nợ NCC, phân bổ
      # xuất kho, nhật ký thao tác) mà không phải chạy DDL thủ công.
      # Lưu ý: update chỉ THÊM bảng/cột, không bao giờ sửa kiểu hay xóa cột thừa, và không chạy
      # được phần backfill dữ liệu. Xem docs/migration-cong-no-ncc-bao-cao-nhat-ky.sql.
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
    show-sql: true
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: ${REDIS_SSL:false}
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  signerKey: ${SIGNER_KEY}
  valid-duration: 1800
  refreshable-duration: 604800

rate-limit:
  auth:
    window-seconds: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:60}
    login: ${AUTH_RATE_LIMIT_LOGIN:10}
    refresh: ${AUTH_RATE_LIMIT_REFRESH:30}
    logout: ${AUTH_RATE_LIMIT_LOGOUT:30}
    csrf: ${AUTH_RATE_LIMIT_CSRF:60}

# Mặc định cho production (Render): FE và BE khác domain (cross-site) nên
# bắt buộc Secure=true + SameSite=None thì trình duyệt mới gửi cookie kèm request.
# application-local.yaml override lại thành false/Lax để chạy http://localhost.
cookie:
  secure: ${COOKIE_SECURE:true}
  same-site: ${COOKIE_SAME_SITE:None}

vnpay:
  tmn-code: ${TMN_CODE}
  hash-secret: ${HASH_SECRET}
  base-url: ${BASE_URL}
  return-url: ${RETURN_URL}
  version: 2.1.0
  command: pay
  curr-code: VND
  locale: vn

timezone:
  id: Asia/Ho_Chi_Minh

cong-no:
  phan-tram-canh-bao: 80
  so-ngay-khoa: 30

# Nhắc trước bao nhiêu ngày trước hạn phải trả tiền nhà cung cấp. Khác phía khách hàng (chỉ nhắc
# khi đã quá hạn vì đã có cơ chế khóa đặt hàng), ở đây phải nhắc trước — hệ thống không tự chặn hộ.
cong-no-ncc:
  so-ngay-nhac-truoc: 2
  # Số ngày được nợ áp dụng khi nhà cung cấp chưa khai hạn trả riêng. Mọi phiếu nhập đều phải có
  # hạn trả: phiếu để hantra = null sẽ bị loại khỏi truy vấn của scheduler nên không bao giờ được
  # nhắc, dù thực tế đang nợ.
  han-tra-mac-dinh: 7

bao-cao:
  # Ngưỡng % lệch giữa kg dự kiến và kg cân thật, vượt qua thì đánh dấu cảnh báo trên báo cáo.
  nguong-hao-hut-phan-tram: 5

springdoc:
  swagger-ui:
    path: ${SWAGGER_UI}
  api-docs:
    path: ${API_DOCS}

frontend:
  # Base URL duy nhất của FE, dùng để dựng link redirect VNPay và link trong email.
  # Có thể kèm path nếu FE nằm dưới thư mục con (GitHub Pages project page):
  # https://minhquan0802.github.io/QuanLyVuaCa
  url: ${FRONTEND_URL}
  # Danh sách origin được phép gọi API (CORS), cách nhau bởi dấu phẩy. Mặc định
  # bằng FRONTEND_URL; chỉ cần khai riêng khi chạy nhiều FE cùng lúc (Render +
  # GitHub Pages). Path và dấu "/" cuối sẽ được tự cắt bỏ.
  allowed-origins: ${FRONTEND_ALLOWED_ORIGINS:${FRONTEND_URL}}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}
